<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waitlists | Sausage Therapy</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="banner">First-in line for Coaster merch, farm days, and dachshund placements.</div>
  <nav class="nav">
    <a class="brand" href="index.html">Sausage <span>Therapy</span></a>
    <div class="nav-links">
      <a href="shop.html">Shop</a>
      <a href="events.html">Events</a>
      <a href="waitlist.html">Waitlist</a>
      <a class="btn" href="book.html">Start a session</a>
    </div>
  </nav>
  <header class="hero">
    <div>
      <p class="kicker">Capture demand before supply is ready</p>
      <h1>Get in line without losing the heat.</h1>
      <form action="mailto:hello@sausagetherapy.com?subject=Waitlist" method="post" enctype="text/plain">
        <input name="name" placeholder="Your name" required />
        <input type="email" name="email" placeholder="Email" required />
        <select name="list" required>
          <option value="">Which list?</option>
          <option>Wiener Coaster merch drop</option>
          <option>Farm open day</option>
          <option>Therapy dachshund enquiry / Noosa Dachshunds</option>
          <option>Mobile Coaster visit in my town</option>
        </select>
        <textarea name="note" rows="4" placeholder="Town, timing, anything we should know"></textarea>
        <button class="btn" type="submit">Join waitlist</button>
      </form>
    </div>
  </header>
  <footer class="footer"><div><strong>Sausage Therapy waitlists</strong></div><div><a href="index.html">Home</a></div></footer>
</body>
</html>
